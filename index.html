<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Fighter Tracker</title>
<style>
:root{--bg:#0a0a0c;--card:#141418;--card2:#1b1b21;--line:#2a2a33;--txt:#f2f2f5;--mut:#8c8c99;--red:#ff1f3d;--red2:#ff5468;--grn:#2ee66b;--yel:#ffd028;--r:14px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:"Barlow Condensed","Arial Narrow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.35}
body{padding:calc(env(safe-area-inset-top,0px) + 64px) 0 calc(env(safe-area-inset-bottom,0px) + 76px)}
header{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(10,10,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:24px;font-weight:800;letter-spacing:.5px;font-style:italic}
.logo b{color:var(--red)}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--red);border:0;color:#fff;font-weight:700;letter-spacing:.4px;padding:10px 14px;border-radius:10px;cursor:pointer;box-shadow:0 0 18px rgba(255,31,61,.35)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--txt)}
.btn.sm{padding:6px 10px;font-size:15px}
main{max-width:720px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(14,14,17,.96);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:11px 4px 9px;color:var(--mut);font-size:15px;font-weight:600;cursor:pointer;border-top:3px solid transparent}
nav button span{display:block;font-size:21px}
nav button.on{color:var(--red2);border-top-color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
h2{font-size:26px;font-weight:800;margin:4px 0 12px;font-style:italic}
h3{font-size:20px;font-weight:700}
.mut{color:var(--mut);font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:12px;padding:12px;border-left:3px solid var(--red)}
.stat b{display:block;font-size:32px;line-height:1.05;font-weight:800}
.stat small{color:var(--mut);font-size:14px}
.kcal{grid-column:1/-1;border-left-width:5px}
.kcal b{font-size:46px;color:var(--red2);text-shadow:0 0 24px rgba(255,31,61,.45)}
.alert{border-radius:12px;padding:11px 13px;margin:8px 0;font-weight:600;border:1px solid;font-size:17px}
.alert.g{background:rgba(46,230,107,.1);border-color:var(--grn);color:#8bffb3}
.alert.y{background:rgba(255,208,40,.1);border-color:var(--yel);color:#ffe681}
.alert.r{background:rgba(255,31,61,.12);border-color:var(--red);color:#ff9aa8}
.alert.n{background:var(--card2);border-color:var(--line);color:var(--txt)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;background:var(--card);border:1px solid var(--line);padding:10px 4px;border-radius:12px;font-weight:700;cursor:pointer;color:var(--mut)}
.tabs button small{display:block;font-weight:500;font-size:13px}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 18px rgba(255,31,61,.35)}
.ex-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tag{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:14px;color:var(--red2);white-space:nowrap}
.last{margin:6px 0;color:var(--mut);font-size:15px}
.last b{color:var(--txt)}
input,select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;font-size:17px}
input:focus,textarea:focus{outline:2px solid var(--red);border-color:var(--red)}
.row{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px}
.row i{font-style:normal;color:var(--mut);text-align:center}
.cols{display:grid;grid-template-columns:34px 1fr 1fr;gap:8px;color:var(--mut);font-size:13px;margin:8px 0 2px}
.date{margin-bottom:6px}
details{margin-top:10px}
summary{cursor:pointer;color:var(--mut);font-size:15px}
.hist{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:6px 0;font-size:15px;gap:8px}
.x{background:none;border:0;color:var(--red2);cursor:pointer;font-size:18px;padding:4px 8px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.macros .stat b{font-size:26px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.8);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:720px;max-height:92vh;padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:10px}
.sheet textarea{flex:1;min-height:48vh;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;resize:none}
.btns{display:flex;gap:8px}.btns .btn{flex:1}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--red);padding:9px 16px;border-radius:30px;font-weight:700;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
svg{width:100%;height:auto;display:block}
@media (min-width:700px){body{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo">FIGHTER<b>.</b>TRACK</div>
  <button class="btn" id="btnReport">📋 ESTRAI REPORT PER CHAT</button>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-tab="dash" class="on"><span>📊</span>Dashboard</button>
  <button data-tab="train"><span>🥊</span>Allenamento</button>
  <button data-tab="diet"><span>🥗</span>Peso &amp; Dieta</button>
</nav>
<div class="modal" id="modal">
  <div class="sheet">
    <h3>Report per la Chat</h3>
    <textarea id="reportTxt" readonly></textarea>
    <div class="btns"><button class="btn" id="btnCopy">Copia negli appunti</button><button class="btn ghost" id="btnClose">Chiudi</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
